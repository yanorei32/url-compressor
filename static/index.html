<html>
  <head>
    <meta charset=utf-8>
    <title>URL Compressor</title>
    <meta name=viewport content="width=device-width, initial-scale=1.0">
    <style>
      html, body {
        width: 100%;
        padding: 0;
        margin: 0;
        border: 0;
      }
      .container {
        width: 100%;
        max-width: 800px;
        margin: auto;
      }
      input {
        width: 100%;
        font-size: 150%;
      }
      .worst {
        color: darkred;
      }
      .good {
        color: darkgreen;
      }
    </style>
  </head>
  <body>
    <div class=container id=compressor>
      <h1>URL Compressor</h1>
      <p>URLを圧縮します。Discordへの貼り付けなどにどうぞ。zstd (level:20)→base32768</p>
      <label for=original>Original:</label><br>
      <input type=text id=original placeholder=https://example.com/><br>
      <label for=compressed>Compressed:</label><br>
      <input type=text id=compressed readonly>
      Compression Ratio: <span id=ratio>-</span> %
    </div>
    <div class=container id=jumpPage hidden>
      <h1 id=jumpPageTitle>Loading</h1>
      <button id=openButton hidden></button>
      <br/>
      <a href=./>return</a>
    </div>
    <script type=module>
      import init, * as wasm from './pkg/url_compressor.js';

      if (location.hash !== '') {
        document.getElementById('compressor').hidden = true;
        document.getElementById('jumpPage').hidden = false;
      }

      function update() {
        const original = document.getElementById('original').value;
        const encoded = `${location.href}#${wasm.encode(original)}`;
        document.getElementById('compressed').value = encoded;
        const ratio = encoded.length / original.length;
        document.getElementById('ratio').textContent = (ratio * 100).toFixed(2);
        document.getElementById('ratio').classList.add(ratio < 1 ? "good" : "worst");
        document.getElementById('ratio').classList.remove(ratio >= 1 ? "good" : "worst");
      }

      function handleHash() {
        if (location.hash === '')
          return;

        document.getElementById('compressor').hidden = true;
        document.getElementById('jumpPage').hidden = false;
        document.getElementById('jumpPageTitle').textContent = 'Loading';
        const openButton = document.getElementById('openButton');
        openButton.hidden = true;
        openButton.onclick = null;

        const url = wasm.decode(decodeURIComponent(location.hash.slice(1)));
        const protocol = URL.parse(url).protocol;

        if (['http:', 'https:'].includes(protocol)) {
          document.getElementById('jumpPageTitle').textContent = 'Jump now!';

          location.href = url;
        } else {
          document.getElementById('jumpPageTitle').textContent = 'Decoded!';

          openButton.textContent = `Open (URI protocol is ${protocol} )`;
          openButton.onclick = () => location.href = url;
          openButton.hidden = false;
        }
      }

      async function run() {
        await init();

        handleHash();
        window.addEventListener('hashchange', handleHash);

        update();
        document.getElementById('original').addEventListener('change', update);
        document.getElementById('original').addEventListener('keydown', update);
      }

      run();
    </script>
  </body>
</html>
